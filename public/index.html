<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Doblaje Latino - Entrar</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/assets/styles.css" />
</head>
<body class="text-slate-100 flex items-center justify-center p-4">
  <div class="glass-strong rounded-3xl p-8 w-full max-w-sm">
    <div class="text-center mb-6">
      <div class="text-5xl mb-2">🎙️</div>
      <h1 class="text-2xl font-bold">Doblaje Latino</h1>
      <p class="text-sm text-slate-400">Presta tu voz. Dale vida a tus personajes.</p>
    </div>

    <div class="space-y-3">
      <input id="email" type="email" placeholder="Correo"
        class="w-full glass rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-violet-500" />
      <input id="username" type="text" placeholder="Nombre de usuario (solo registro)"
        class="w-full glass rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-violet-500" />
      <input id="password" type="password" placeholder="Contrasena"
        class="w-full glass rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-violet-500" />
    </div>

    <div class="mt-5 space-y-2">
      <button id="loginBtn" class="btn-primary w-full py-3 rounded-xl font-semibold">Entrar</button>
      <button id="registerBtn" class="glass w-full py-3 rounded-xl font-medium hover:bg-white/10">Crear cuenta</button>
    </div>

    <p id="msg" class="text-center text-sm mt-4 text-slate-300"></p>
  </div>

  <script type="module" src="/js/auth/auth.js"></script>
  <script type="module" src="/js/lib/version.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crear Escena - Doblaje Latino</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/assets/styles.css" />
  <style>
    .trim-track { position: relative; height: 46px; border-radius: 12px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12); }
    .trim-fill { position: absolute; top: 0; bottom: 0; background: rgba(139,92,246,.35); border-left: 2px solid #8b5cf6; border-right: 2px solid #22d3ee; }
    .trim-range { position: absolute; top: 0; left: 0; width: 100%; height: 46px; margin: 0; background: none; pointer-events: none; -webkit-appearance: none; appearance: none; }
    .trim-range::-webkit-slider-thumb { -webkit-appearance: none; pointer-events: auto; width: 18px; height: 46px; border-radius: 6px; background: #8b5cf6; cursor: ew-resize; box-shadow: 0 0 8px rgba(139,92,246,.7); }
    .trim-range::-moz-range-thumb { pointer-events: auto; width: 18px; height: 46px; border: 0; border-radius: 6px; background: #8b5cf6; cursor: ew-resize; }
    #outRange::-webkit-slider-thumb { background: #22d3ee; box-shadow: 0 0 8px rgba(34,211,238,.7); }
    .step { opacity: .4; } .step.active { opacity: 1; } .step.done { opacity: .8; }
    .phase { display: none; } .phase.active { display: block; }
    .rev-line.playing { outline: 2px solid rgba(139,92,246,.6); }
    .rev-line.dragging { opacity: .4; }
    .rev-line.drop-target { border-top: 3px solid #22d3ee; }
    .rev-line.expr { font-style: italic; }
    #revTc { text-shadow: 0 1px 4px #000; pointer-events: none; }
    #revSub { text-shadow: 0 2px 8px #000, 0 0 4px #000; pointer-events: none; }
    /* ruler timeline */
    .tl-ruler { position: relative; height: 14px; }
    .tl-tick { position: absolute; font-size: 9px; color: #94a3b8; transform: translateX(-50%); }
    .dr-track { position: relative; height: 26px; border-radius: 8px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12); }
    .dr-fill { position: absolute; top: 0; bottom: 0; background: rgba(139,92,246,.30); }
    .dr-range { position: absolute; top: 0; left: 0; width: 100%; height: 26px; margin: 0; background: none; pointer-events: none; -webkit-appearance: none; appearance: none; }
    .dr-range::-webkit-slider-thumb { -webkit-appearance: none; pointer-events: auto; width: 12px; height: 26px; border-radius: 4px; background: #8b5cf6; cursor: ew-resize; }
    .dr-range::-moz-range-thumb { pointer-events: auto; width: 12px; height: 26px; border: 0; border-radius: 4px; background: #8b5cf6; cursor: ew-resize; }
    .dr-range.end::-webkit-slider-thumb { background: #22d3ee; }
    .dr-range.end::-moz-range-thumb { background: #22d3ee; }
    .drag-handle { cursor: grab; }
    .ln-area { resize: none; overflow: hidden; }
    /* divisor ajustable */
    #divider { width: 8px; cursor: col-resize; background: rgba(255,255,255,.08); border-radius: 4px; }
    #divider:hover { background: rgba(139,92,246,.5); }
    /* timeline por personajes */
    .tl-row { position: relative; height: 22px; border-radius: 6px; background: rgba(255,255,255,.05); }
    .tl-bar { position: absolute; top: 2px; bottom: 2px; border-radius: 4px; cursor: pointer; font-size: 9px; overflow: hidden; white-space: nowrap; }
    #tlCursor { position: absolute; top: 0; bottom: 0; width: 2px; background: #fff; opacity: .8; pointer-events: none; }
  </style>
</head>
<body class="text-slate-100">
  <header class="glass sticky top-0 z-20 px-6 py-3 flex items-center justify-between">
    <a href="/dashboard.html" class="flex items-center gap-2 hover:opacity-80">
      <span>&larr;</span><span class="text-2xl">&#127916;</span><h1 id="creatorTitle" class="font-bold">Crear Escena</h1>
    </a>
    <div class="hidden sm:flex items-center gap-3 text-xs">
      <span id="stepDot1" class="step active">1&middot;Crear</span><span>&rarr;</span>
      <span id="stepDot2" class="step">2&middot;Revisar</span><span>&rarr;</span>
      <span id="stepDot3" class="step">3&middot;Publicar</span>
    </div>
  </header>

  <main class="w-full px-3 sm:px-5 py-4">

    <!-- FASE 1 -->
    <section id="phase1" class="phase active">
      <div class="glass rounded-2xl p-6 space-y-4 max-w-4xl mx-auto">
        <h2 class="font-bold text-lg">1 &middot; Sube, recorta y analiza</h2>
        <input id="videoInput" type="file" accept="video/*"
          class="block w-full text-sm text-slate-300 file:mr-3 file:py-2 file:px-4 file:rounded-lg file:border-0 file:bg-violet-600 file:text-white" />
        <video id="preview" class="w-full rounded-xl bg-black aspect-video hidden" controls></video>
        <div id="trimBlock" class="hidden space-y-3">
          <p class="text-xs text-slate-400">Ajusta el fragmento.</p>
          <div class="trim-track" id="trimTrack">
            <div class="trim-fill" id="trimFill"></div>
            <input type="range" id="inRange" class="trim-range" min="0" max="100" step="0.1" value="0">
            <input type="range" id="outRange" class="trim-range" min="0" max="100" step="0.1" value="100">
          </div>
          <div class="flex justify-between text-xs font-mono">
            <span>Inicio: <b id="inLabel" class="text-violet-300">0.0s</b></span>
            <span>Duraci&oacute;n: <b id="selDur" class="text-slate-200">0.0s</b></span>
            <span>Fin: <b id="outLabel" class="text-cyan-300">0.0s</b></span>
          </div>
          <div class="flex flex-wrap gap-2">
            <button id="markIn" class="glass px-3 py-2 rounded-lg text-xs hover:bg-white/10">&#9210; Marcar inicio</button>
            <button id="playSel" class="glass px-3 py-2 rounded-lg text-xs hover:bg-white/10">&#9654; Ver selecci&oacute;n</button>
            <button id="markOut" class="glass px-3 py-2 rounded-lg text-xs hover:bg-white/10">&#9209; Marcar fin</button>
          </div>
          <label class="text-sm block">Relaci&oacute;n de aspecto
            <select id="aspect" class="w-full glass rounded-lg px-3 py-2 mt-1 bg-transparent">
              <option value="original" class="bg-slate-800">Original</option>
              <option value="16:9" class="bg-slate-800">16:9</option>
              <option value="9:16" class="bg-slate-800">9:16</option>
              <option value="1:1" class="bg-slate-800">1:1</option>
            </select>
          </label>
          <div class="flex items-center gap-3">
            <button id="cutAnalyzeBtn" class="btn-primary px-5 py-3 rounded-xl font-semibold">&#9986; Recortar y analizar &rarr;</button>
            <span id="p1Status" class="text-sm text-slate-300"></span>
          </div>
          <div class="h-2 rounded-full bg-white/10 overflow-hidden hidden" id="p1BarWrap"><div id="p1Bar" class="xp-bar h-full bg-cyan-400" style="width:0%"></div></div>
        </div>
      </div>
    </section>

    <!-- FASE 2 -->
    <section id="phase2" class="phase">
      <div id="revSplit" class="flex flex-col lg:flex-row gap-2 items-stretch">
        <!-- IZQUIERDA: video + timeline + personajes -->
        <div id="leftPane" class="space-y-3 lg:sticky lg:top-20 self-start" style="flex: 0 0 58%">
          <div class="glass rounded-2xl p-2">
            <div class="relative">
              <video id="reviewVideo" class="w-full rounded-xl bg-black aspect-video" controls controlslist="nodownload noplaybackrate noremoteplayback" disablepictureinpicture></video>
              <div id="revTc" class="absolute top-2 left-1/2 -translate-x-1/2 font-mono text-3xl font-bold bg-black/65 px-4 py-1 rounded">00:00:00</div>
              <div id="revSub" class="absolute bottom-4 left-2 right-2 text-center text-2xl sm:text-3xl font-bold px-3 py-2 rounded bg-black/60"></div>
            </div>
          </div>
          <!-- Linea de tiempo por personajes -->
          <div class="glass rounded-2xl p-3">
            <div class="flex items-center justify-between mb-2">
              <h3 class="text-sm font-semibold">&#9202;&#65039; L&iacute;nea de tiempo</h3>
              <span class="text-[11px] text-slate-400">Clic en una barra para ir a esa l&iacute;nea</span>
            </div>
            <div id="timeline" class="space-y-1 relative"></div>
          </div>
          <div class="glass rounded-2xl p-3">
            <div class="flex items-center justify-between mb-2">
              <h3 class="text-sm font-semibold">&#127917; Personajes</h3>
              <div class="flex gap-2">
                <button id="detectNamesBtn" class="glass px-2 py-1 rounded text-xs hover:bg-white/10">&#128269; Buscar nombres</button>
                <button id="translateBtn" class="glass px-2 py-1 rounded text-xs hover:bg-white/10">&#127760; Traducir</button>
              </div>
            </div>
            <div id="charManager" class="flex flex-wrap gap-2 mb-2"></div>
            <div class="flex gap-2">
              <input id="newCharName" placeholder="Nuevo personaje" class="flex-1 glass rounded-lg px-2 py-1 text-sm">
              <input id="newCharColor" type="color" value="#8b5cf6" class="w-9 h-9 rounded bg-transparent">
              <button id="addCharBtn" class="glass px-3 rounded-lg text-sm hover:bg-white/10">+ personaje</button>
            </div>
            <p id="p2Status" class="text-xs text-slate-400 mt-2"></p>
          </div>
        </div>

        <div id="divider" class="hidden lg:block self-stretch"></div>

        <!-- DERECHA: libreto -->
        <div id="rightPane" class="glass rounded-2xl p-4 flex-1 min-w-0">
          <div class="flex items-center justify-between mb-2 flex-wrap gap-2">
            <h3 class="text-sm font-semibold">&#128220; L&iacute;neas</h3>
            <div class="flex gap-2">
              <select id="exprSelect" class="glass rounded px-2 py-1 text-xs bg-transparent">
                <option class="bg-slate-800" value="(RISA)">Risa</option>
                <option class="bg-slate-800" value="(WALLA)">Walla</option>
                <option class="bg-slate-800" value="(GRITO)">Grito</option>
                <option class="bg-slate-800" value="(SUSPIRO)">Suspiro</option>
                <option class="bg-slate-800" value="(LLANTO)">Llanto</option>
                <option class="bg-slate-800" value="(TOS)">Tos</option>
                <option class="bg-slate-800" value="(SILENCIO)">Silencio</option>
                <option class="bg-slate-800" value="(REC)">Rec</option>
              </select>
              <button id="addExprBtn" class="glass px-2 py-1 rounded-lg text-xs hover:bg-white/10">+ Expresi&oacute;n</button>
              <button id="addLineBtn" class="glass px-2 py-1 rounded-lg text-xs hover:bg-white/10">+ L&iacute;nea</button>
            </div>
          </div>
          <div id="reviewLines" class="space-y-2 max-h-[80vh] overflow-y-auto thin-scroll pr-1"></div>
        </div>
      </div>
      <div class="flex justify-end mt-4">
        <button id="toPhase3" class="btn-primary px-5 py-3 rounded-xl font-semibold">Continuar a publicar &rarr;</button>
      </div>
    </section>

    <!-- FASE 3 -->
    <section id="phase3" class="phase">
      <div class="glass rounded-2xl p-6 max-w-lg mx-auto">
        <h2 class="font-bold text-lg mb-3">3 &middot; Publicar</h2>
        <input id="sceneTitle" placeholder="T&iacute;tulo de la escena" class="w-full glass rounded-lg px-3 py-2 text-sm mb-3">
        <div class="flex items-center gap-3">
          <button id="publishBtn" class="btn-primary px-5 py-3 rounded-xl font-semibold">&#128640; Publicar escena</button>
          <span id="publishStatus" class="text-sm text-slate-400"></span>
        </div>
      </div>
    </section>
  </main>

  <script type="module" src="/js/creator/creator.js"></script>
  <script type="module" src="/js/lib/version.js"></script>
</body>
</html>

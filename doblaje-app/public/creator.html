<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crear Escena - Doblaje Latino</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/assets/styles.css" />
</head>
<body class="text-slate-100">
  <header class="glass sticky top-0 z-20 px-6 py-3 flex items-center justify-between">
    <a href="/dashboard.html" class="flex items-center gap-2 hover:opacity-80">
      <span>←</span><span class="text-2xl">🎬</span><h1 class="font-bold">Crear Escena</h1>
    </a>
  </header>

  <main class="max-w-3xl mx-auto p-6 space-y-6">

    <!-- 1. Subir video -->
    <section class="glass rounded-2xl p-5">
      <h2 class="font-bold mb-3">1 · Sube tu video</h2>
      <input id="videoInput" type="file" accept="video/*"
        class="block w-full text-sm text-slate-300 file:mr-3 file:py-2 file:px-4 file:rounded-lg file:border-0 file:bg-violet-600 file:text-white" />
      <video id="preview" class="w-full rounded-xl bg-black aspect-video mt-4 hidden" controls></video>
    </section>

    <!-- 2. Recorte + aspecto -->
    <section id="trimSection" class="glass rounded-2xl p-5 hidden">
      <h2 class="font-bold mb-3">2 · Recorta y ajusta</h2>
      <div class="grid grid-cols-2 gap-4">
        <label class="text-sm">Inicio (s)
          <input id="inPoint" type="number" step="0.1" value="0" class="w-full glass rounded-lg px-3 py-2 mt-1">
        </label>
        <label class="text-sm">Fin (s)
          <input id="outPoint" type="number" step="0.1" value="30" class="w-full glass rounded-lg px-3 py-2 mt-1">
        </label>
      </div>
      <label class="text-sm block mt-3">Relación de aspecto
        <select id="aspect" class="w-full glass rounded-lg px-3 py-2 mt-1 bg-transparent">
          <option value="original" class="bg-slate-800">Original</option>
          <option value="16:9" class="bg-slate-800">16:9 (horizontal)</option>
          <option value="9:16" class="bg-slate-800">9:16 (vertical)</option>
          <option value="1:1" class="bg-slate-800">1:1 (cuadrado)</option>
        </select>
      </label>
      <button id="trimBtn" class="btn-primary mt-4 px-4 py-2 rounded-lg text-sm font-semibold">✂️ Recortar</button>
      <span id="trimStatus" class="text-sm text-slate-400 ml-3"></span>
    </section>

    <!-- 3. Personajes -->
    <section id="charSection" class="glass rounded-2xl p-5 hidden">
      <h2 class="font-bold mb-3">3 · Personajes</h2>
      <div id="charList" class="space-y-2 mb-3"></div>
      <div class="flex gap-2">
        <input id="charName" placeholder="Nombre (ej. Billy)" class="flex-1 glass rounded-lg px-3 py-2 text-sm">
        <input id="charColor" type="color" value="#8b5cf6" class="w-12 h-10 rounded-lg bg-transparent">
        <button id="addChar" class="glass px-4 rounded-lg text-sm hover:bg-white/10">+ Añadir</button>
      </div>
    </section>

    <!-- 4. Deteccion de dialogos -->
    <section id="dialSection" class="glass rounded-2xl p-5 hidden">
      <h2 class="font-bold mb-1">4 · Diálogos</h2>
      <p class="text-xs text-slate-400 mb-3">
        Detección automática (mockup): segmenta el audio en líneas. En producción se conecta a un
        servicio de transcripción + diarización (ver README).
      </p>
      <button id="detectBtn" class="glass px-4 py-2 rounded-lg text-sm hover:bg-white/10 mb-3">🤖 Detectar líneas</button>
      <div id="dialList" class="space-y-2"></div>
    </section>

    <!-- 5. Publicar -->
    <section id="publishSection" class="glass rounded-2xl p-5 hidden">
      <h2 class="font-bold mb-3">5 · Publicar</h2>
      <input id="sceneTitle" placeholder="Título de la escena" class="w-full glass rounded-lg px-3 py-2 text-sm mb-3">
      <button id="publishBtn" class="btn-primary px-5 py-3 rounded-xl font-semibold">🚀 Publicar escena</button>
      <span id="publishStatus" class="text-sm text-slate-400 ml-3"></span>
    </section>
  </main>

  <script type="module" src="/js/creator/creator.js"></script>
</body>
</html>
